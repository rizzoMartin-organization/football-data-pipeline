name: CI/CD

on:
  pull_request:
    branches:
      - master
    paths:
      - 'airflow/dags/**'
  push:
    branches:
      - master
    paths:
      - 'airflow/dags/**'
  workflow_dispatch:

jobs:
  ci:
    name: Validate DAGs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint
        run: flake8 airflow/dags/ --max-line-length=120

      - name: Validate DAG imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'airflow/dags')
          import football_pipeline_dag
          print('DAG importado correctamente')
          "

  cd:
    name: Deploy DAGs
    runs-on: self-hosted
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy DAGs to airflow
        run: |
          cp airflow/dags/*.py /home/martin/dock
          echo "DAGs desplegados en $(date)"